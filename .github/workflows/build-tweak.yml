name: Build iReadNote Tweak Dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'

permissions:
  contents: write

jobs:
  build:
    name: Compile arm64 dylib on macOS 26
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify macOS >= 15
        run: |
          sw_vers
          V=$(sw_vers -productVersion | cut -d. -f1)
          echo "macOS major=$V (require >=15)"
          test "$V" -ge 15 || { echo "::error::macOS < 15"; exit 1; }
          clang --version | head -2
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile tweak dylib (arm64)
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=13.0 -fobjc-arc -fobjc-runtime=ios-13.0 \
            -framework Foundation -framework UIKit \
            -install_name @rpath/iReadNoteTweak.dylib \
            -o tweak/iReadNoteTweak.dylib tweak/iReadNoteTweak.m
          file tweak/iReadNoteTweak.dylib
          ls -lh tweak/iReadNoteTweak.dylib
          otool -L tweak/iReadNoteTweak.dylib
          shasum -a 256 tweak/iReadNoteTweak.dylib

      - name: Publish dylib as Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="tweak-dylib"
          gh release delete "$TAG" -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" tweak/iReadNoteTweak.dylib \
            --repo "$GITHUB_REPOSITORY" \
            --title "iReadNote tweak dylib (arm64, macOS 26)" \
            --notes "Pure ObjC runtime tweak for LCSign injection."
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
